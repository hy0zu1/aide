<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Creative Agent</title>
</head>
<body>
  <p id="status" role="status" aria-live="polite">채팅에 연결하는 중입니다...</p>
  <div id="webchat" style="height: 600px"></div>
  <script src="https://cdn.botframework.com/botframework-webchat/4.18.0/webchat.js"></script>
  <script>
    const BROKER_URL = "https://dl-broker-juwon-4jt3z.azurewebsites.net/api/directlineToken";
    const SEALED = "QqOnaBSK3Ch_NUFiWhBYa-V4yuBH4vdWzDatl8NoxJLYMs9vDxddLG0VKNxEf0XB6erlzMzgYIK6FuoL4-YBsM_cnY3G7H-1Auvi9bzpIwkb3TmRTj9U82fKhyUTDMh-IaHs7vdpbRbyhX_ss-B0XY8nU5tpqxj7lVf-BWi2nwEJqn2zSEKeZ3y_9TBlVWUT9k0tulkAaRi2ItJMvvOKdmbhbZeIh8qkA-V-EmKJusIVk-qiDGzRJGNpndRTXlgvYSkI99YpX8JNGV95v_oFwDpmHfzLFZuWNp25yBf5M284YIkIcf-SEXIZBrMFnHmjYdoDkKgH4i1f1y3zVaJYz-eNMP4GbC5rihTryKMBicib2ypl4MqN1zdDEMYBj7qQM-g_re3KaEYeL4s3sfpARr-FWpUsCK__shwJuw6t-ytYCse3b1IyIIfPgD45qzQdpB4yEgV5IZcsqeBwcEQsDAEbg06ndEVTVH-sD_nUi4vHo-GDN5fG9fRVQCEwWZQ2raP49LmgVb0V6xU-8h4SWQ2yHIPkp9Cky1Vax-YuCj2lLLfjJGxDtps2MPffcs5Bfi7xLW-NQnghwkBa7qxyiB88rJQk_h2Fnwrpr4NTUaKtMqHVqHG705v1Z_-cGRglcf8QODzdVEYYiExX";
    const status = document.getElementById("status");

    function showError(message) {
      status.hidden = false;
      status.textContent = message;
    }

    async function connect() {
      if (!window.WebChat ||
          typeof WebChat.createDirectLine !== "function" ||
          typeof WebChat.renderWebChat !== "function") {
        showError("채팅 구성 요소를 불러오지 못했습니다. 네트워크를 확인한 뒤 새로고침해 주세요.");
        return;
      }

      let response;
      try {
        // Keep this a simple CORS request; the broker may not support preflight.
        response = await fetch(BROKER_URL, {
          method: "POST",
          body: JSON.stringify({ sealed: SEALED })
        });
      } catch {
        showError("서버에 연결하지 못했습니다. 네트워크와 배포 주소를 확인해 주세요.");
        return;
      }
      if (!response.ok) {
        showError("서버가 연결 요청을 처리하지 못했습니다 (HTTP " + response.status + ").");
        return;
      }

      let data;
      try {
        data = await response.json();
      } catch {
        showError("서버 응답을 읽을 수 없습니다. 잠시 후 다시 시도해 주세요.");
        return;
      }
      if (!data || typeof data.token !== "string" || !data.token.trim()) {
        showError("서버에서 연결 토큰을 받지 못했습니다. 암호와 배포 주소를 확인해 주세요.");
        return;
      }

      try {
        const directLine = WebChat.createDirectLine({ token: data.token });
        status.hidden = true;
        directLine.postActivity({
          type: "event", name: "startConversation", from: { id: "user" }
        }).subscribe({
          error: () => showError("첫 인사를 요청하지 못했습니다. 채팅창에 메시지를 입력해 주세요.")
        });
        WebChat.renderWebChat({ directLine, locale: "ko-KR" }, document.getElementById("webchat"));
      } catch {
        showError("채팅을 시작하지 못했습니다. 새로고침 후 다시 시도해 주세요.");
      }
    }

    connect();
  </script>
</body>
</html>
